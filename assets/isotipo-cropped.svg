           L 184 91
           C 176 86, 168 83, 158 84
           C 146 85.5, 141 93, 128 93
           C 113 93, 106 86, 96 80
           C 88.5 75, 82.5 74.5, 76 78
           Z"
        fill="url(#isoGrad)"/>

  <!-- White growth arrow / swoosh cut into the "A" -->
  <path d="M 90 82
           C 100 82, 111 78, 119 68
           L 108 64
           L 132 51
           L 128 78
           L 121 68
           C 113 79, 101 84, 90 86
           Z"
        fill="#ffffff"/>
</svg>
