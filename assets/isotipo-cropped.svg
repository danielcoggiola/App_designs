<svg viewBox="0 0 200 112" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="iA">
  <defs>
    <linearGradient id="isoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0031D4"/>
      <stop offset="55%" stop-color="#0179E2"/>
      <stop offset="100%" stop-color="#3DFFDF"/>
    </linearGradient>
  </defs>

  <!-- "i" stem, split by a gap -->
  <rect x="18" y="19" width="26" height="49" rx="13" fill="#0060D8"/>
  <rect x="18" y="77" width="26" height="14" rx="7" fill="#0060D8"/>

  <!-- "A" triangle with a wave cut at the base -->
