  <script>
    // RES(url): in the live project returns the URL unchanged; in the bundled
    // standalone file returns the inlined blob URL the bundler stashed in
    // window.__resources. The bundler strips the meta tags after building
    // window.__resources, so the URL→id map is hardcoded here to survive that.
    (function () {
      var MAP = {
        'https://images.unsplash.com/photo-1552432552-06c0b0a94dda?w=800&q=80': 'u_coliseo',
        'https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=800&q=80': 'u_maldivas800',

        'assets/logo-aventuria-white-cropped.png': 'a_logo_white',
        'assets/logo-aventuria-cropped.png': 'a_logo'
      };
      window.RES = function (url) {
        var id = MAP[url];
        if (id && window.__resources && window.__resources[id]) return window.__resources[id];
        return url;
      };
    })();

      const need = ['DesignCanvas','DCSection','DCArtboard','PhoneShell','ProductosHub','WalletLibreScreen','WalletLibreContribute','WalletTravelScreen','WalletTravelCatalog','TNPLCatalog','TNPLTerms','LoadingScreen','LoginScreen','SignupScreen','DiscoverScreen','C','GRADIENT_IA','FONT','Ic',

        'LibreCrearSuenoDesktop','LibreConfirmacionDesktop','WalletsMenuDesktop',
        'FinanciamientoSolicitud','FinanciamientoSolicitudDesktop'];
      if (!need.every(k => window[k])) return setTimeout(waitForGlobals, 50);

      // Resolve lucide icons on demand: once after mount, then only when new
      // artboard subtrees appear (observer is debounced) — no forever interval.
      (function scheduleIcons() {
        let queued = false;
        const run = () => { queued = false; window.lucide && window.lucide.createIcons(); };
        const ping = () => { if (queued) return; queued = true; requestAnimationFrame(() => setTimeout(run, 120)); };
        ping();
        new MutationObserver(muts => {
          for (const m of muts) {
            for (const n of m.addedNodes) {
              if (n.nodeType === 1 && (n.matches?.('[data-lucide]') || n.querySelector?.('[data-lucide]'))) { ping(); return; }
            }
          }
        }).observe(document.getElementById('root'), { childList: true, subtree: true });
      })();

      const PHONE_W = 360;
      const PHONE_H = 760;

      // Wrapper that sizes everything inside an artboard.
      function PhoneAB({ label, dark, children }) {
        return (
          <div className="av-phone" style={{ width: PHONE_W, height: PHONE_H, position: 'relative' }}>
            <PhoneShell dark={dark} label={label} height={PHONE_H}>
              {children}
            </PhoneShell>
          </div>
        );
      }

      const DESKTOP_W = 1440;
      const DESKTOP_H = 900;
      function DesktopAB({ label, children }) {
        return (
          <div className="av-phone" data-screen-label={label} style={{ width: DESKTOP_W, height: DESKTOP_H, position: 'relative', overflow: 'hidden' }}>
            {children}

                <DesktopAB label="Wallet Libre — main (desktop, dark)"><WalletLibreDesktopMain dark={true}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-libre-contribute" label="Aportar · panel" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Libre — contribute (desktop)"><WalletLibreDesktopContribute dark={false}/></DesktopAB>
              </DCArtboard>
            </DCSection>

            {/* === Desktop · Wallet Libre · Crear “Tu sueño” ===================== */}
            <DCSection id="desktop-libre-nuevo" title="Desktop · Wallet Libre · Crear “Tu sueño”"
              subtitle="Formulario a la izquierda con vista previa viva de la wallet a la derecha; confirmación con resumen e interés estimado.">
              <DCArtboard id="desktop-libre-sueno" label="Tu sueño · light" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Libre — crear tu sueño (desktop, light)"><LibreCrearSuenoDesktop dark={false}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-libre-confirm" label="Confirmación · light" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Libre — confirmación (desktop, light)"><LibreConfirmacionDesktop dark={false}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-libre-confirm-dark" label="Confirmación · dark" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Libre — confirmación (desktop, dark)"><LibreConfirmacionDesktop dark={true}/></DesktopAB>
              </DCArtboard>
            </DCSection>

            {/* === Desktop · Wallet Travel ======================================== */}
            <DCSection id="desktop-travel" title="Desktop · Wallet Aventuria"
              subtitle="Foto de destino + progreso a la izquierda, hitos del viaje a la derecha · catálogo en grid de 2 columnas.">
              <DCArtboard id="desktop-travel-main-light" label="Main · light" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Travel — main (desktop, light)"><WalletTravelDesktopMain dark={false}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-travel-main-dark" label="Main · dark" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Travel — main (desktop, dark)"><WalletTravelDesktopMain dark={true}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-travel-catalog-light" label="Catálogo · light" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Travel — catalog (desktop, light)"><WalletTravelDesktopCatalog dark={false}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-travel-catalog-dark" label="Catálogo · dark" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="Wallet Travel — catalog (desktop, dark)"><WalletTravelDesktopCatalog dark={true}/></DesktopAB>
              </DCArtboard>
            </DCSection>

            {/* === Desktop · TNPL ================================================= */}
            <DCSection id="desktop-tnpl" title="Desktop · Travel Now · Pay Later"
              subtitle="Catálogo aspiracional + línea de crédito a la izquierda; desglose de pagos y calendario a la derecha.">
              <DCArtboard id="desktop-tnpl-catalog-light" label="Catálogo · light" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="TNPL — catalog (desktop, light)"><TNPLDesktopCatalog dark={false}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-tnpl-catalog-dark" label="Catálogo · dark" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="TNPL — catalog (desktop, dark)"><TNPLDesktopCatalog dark={true}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-tnpl-terms-light" label="Términos · light" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="TNPL — terms (desktop, light)"><TNPLDesktopTerms dark={false}/></DesktopAB>
              </DCArtboard>
              <DCArtboard id="desktop-tnpl-terms-dark" label="Términos · dark" width={DESKTOP_W} height={DESKTOP_H}>
                <DesktopAB label="TNPL — terms (desktop, dark)"><TNPLDesktopTerms dark={true}/></DesktopAB>
              </DCArtboard>
            </DCSection>

          </DesignCanvas>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    })();
  </script>
</body>
</html>
